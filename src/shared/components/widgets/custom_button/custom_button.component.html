<button [type]="type()" [disabled]="disabled()" (click)="onClick()" class="group inline-flex items-center justify-center gap-3 rounded-none font-poppins font-medium uppercase tracking-[0.12em] transition-all duration-300 disabled:cursor-not-allowed disabled:opacity-50" [class.w-full]="fullWidth()" [class.px-5]="size() === 'sm'"
    [class.py-2.5]="size() === 'sm'" [class.text-[10px]]="size() === 'sm'" [class.px-7]="size() === 'md'"
    [class.py-3.5]="size() === 'md'" [class.text-xs]="size() === 'md'" [class.px-9]="size() === 'lg'"
    [class.py-4]="size() === 'lg'" [class.text-xs]="size() === 'lg'"
    [class.bg-gold]="variant() === 'primary'"
    [class.text-white]="variant() === 'primary'"
    [class.border]="variant() === 'primary'"
    [class.border-gold]="variant() === 'primary'"
    [class.hover:bg-black]="variant() === 'primary'"
    [class.hover:border-black]="variant() === 'primary'"
    [class.bg-transparent]="variant() === 'secondary'"
    [class.text-text]="variant() === 'secondary'"
    [class.border]="variant() === 'secondary'"
    [class.border-gold]="variant() === 'secondary'"
    [class.hover:bg-gold]="variant() === 'secondary'"
    [class.hover:text-white]="variant() === 'secondary'"
    [class.px-0]="variant() === 'text'"
    [class.py-1]="variant() === 'text'"
    [class.text-text]="variant() === 'text'"
    [class.border-b]="variant() === 'text'"
    [class.border-gold]="variant() === 'text'"
    [class.hover:text-gold]="variant() === 'text'"
    >

    <!-- Left icon -->
    @if (icon() && iconPosition() === 'left') {
    <span class="transition-transform duration-300
             group-hover:-translate-x-1">
        {{ icon() }}
    </span>
    }

    <!-- Label -->
    <span>
        {{ label() }}
    </span>

    <!-- Right icon -->
    @if (icon() && iconPosition() === 'right') {
    <span class="transition-transform duration-300
             group-hover:translate-x-1">
        {{ icon() }}
    </span>
    }

</button>
