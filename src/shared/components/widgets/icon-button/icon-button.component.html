<button type="button" [attr.aria-label]="ariaLabel()" (click)="onClick($event)"
    class="cursor-pointer absolute right-5 top-5 z-20 flex h-10 w-10 items-center justify-center bg-white/95 text-gold transition-all duration-300 hover:bg-gold hover:text-white">
    <app-icon [name]="currentIcon()" [size]="'24'" [strokeWidth]="'1.5'">
    </app-icon>
</button>
