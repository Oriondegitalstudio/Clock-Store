<svg [attr.width]="size()" [attr.height]="size()" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
    aria-hidden="true">
    @switch (name()) {

    @case ('heart-outline') {
    <path
        d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78Z"
        fill="none" stroke="currentColor" [attr.stroke-width]="strokeWidth()" stroke-linecap="round"
        stroke-linejoin="round" />
    }

    @case ('heart') {
    <path
        d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78Z"
        fill="currentColor" />
    }

    @case ('search') {
    <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" [attr.stroke-width]="strokeWidth()" />

    <path d="m20 20-4-4" fill="none" stroke="currentColor" [attr.stroke-width]="strokeWidth()" stroke-linecap="round" />
    }

    @case ('shopping-bag') {
    <path d="M5 8h14l1 13H4L5 8Z" fill="none" stroke="currentColor" [attr.stroke-width]="strokeWidth()" />

    <path d="M9 9V6a3 3 0 0 1 6 0v3" fill="none" stroke="currentColor" [attr.stroke-width]="strokeWidth()"
        stroke-linecap="round" />
    }

    @case ('user') {
    <circle cx="12" cy="8" r="3.5" fill="none" stroke="currentColor" [attr.stroke-width]="strokeWidth()" />

    <path d="M5 20a7 7 0 0 1 14 0" fill="none" stroke="currentColor" [attr.stroke-width]="strokeWidth()"
        stroke-linecap="round" />
    }

    @case ('close') {
    <path d="M5 5l14 14M19 5 5 19" fill="none" stroke="currentColor" [attr.stroke-width]="strokeWidth()"
        stroke-linecap="round" />
    }

    @case ('plus') {
    <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" [attr.stroke-width]="strokeWidth()"
        stroke-linecap="round" />
    }

    @case ('minus') {
    <path d="M5 12h14" fill="none" stroke="currentColor" [attr.stroke-width]="strokeWidth()" stroke-linecap="round" />
    }

    @case ('arrow-right') {
    <path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" [attr.stroke-width]="strokeWidth()"
        stroke-linecap="round" stroke-linejoin="round" />
    }

    @case ('arrow-left') {
    <path d="M19 12H5M11 6l-6 6 6 6" fill="none" stroke="currentColor" [attr.stroke-width]="strokeWidth()"
        stroke-linecap="round" stroke-linejoin="round" />
    }
    }
</svg>
