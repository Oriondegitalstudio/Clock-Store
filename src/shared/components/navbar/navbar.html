<header class="w-full h-32 2xl:h-36 bg-transparent z-50 px-6 md:px-8 lg:px-10 py-4">
    <!--desktop-->
    <div class="hidden lg:flex w-full h-full items-center justify-between gap-5">
        <div class="shrink-0">
            <img [src]="imagePath.logo" alt="Aurelis logo" class="w-28 h-28 xl:w-32 xl:h-32 2xl:w-36 2xl:h-36 object-contain" />
        </div>
        <nav class="flex items-center justify-center gap-6 2xl:gap-12">
            <a *ngFor="let l of links" 
                [routerLink]="l.link" 
                routerLinkActive="text-gold after:!w-3/4" 
                [routerLinkActiveOptions]="{ exact: true }"
                class="relative font-poppins capitalize font-medium text-base xl:text-lg whitespace-nowrap transition-colors duration-300
                after:absolute after:inset-s-0 after:-bottom-1 after:h-0.5 after:w-0 after:bg-gold after:transition-all after:duration-300 after:rounded-full">
                {{ l.label | translate }}
            </a>
        </nav>
        <div class="flex items-center justify-end gap-3 2xl:gap-5">
            <div class="relative flex items-center justify-center w-56 xl:w-72">
                <input type="text" name="search" id="search" 
                class="w-full h-10 border-2 border-gold-light outline-none px-3 py-5 font-sans text-sm 2xl:text-base font-normal text-text-muted" 
                [placeholder]="'common.searchPlaceholder'|translate">
                <i class="mdi mdi-magnify absolute inset-e-3 top-1.5 2xl:top-1 text-2xl 2xl:text-xl 2xl:text-[23px] text-gold-light"></i>
            </div>
            <!--action icons: cart, wishlist, profile-->
            <button type="button" class="bg-transparent cursor-pointer">
                <i class="mdi mdi-cart-outline text-2xl 2xl:text-3xl text-gold"></i>
            </button>
            <button type="button" class="bg-transparent cursor-pointer">
                <i class="mdi mdi-heart-outline  text-2xl 2xl:text-3xl text-gold"></i>
            </button>
            <button type="button" class="bg-transparent cursor-pointer">
                <!--profile icon: login/profile-->
                <i class="mdi mdi-account-outline  text-2xl 2xl:text-3xl text-gold"></i>
            </button>
            <!--lang change-->
            <div class="relative">
                <button type="button" class="bg-transparent cursor-pointer" (click)="languageOpen = !languageOpen"
                    aria-label="Change language">
                    <i class="mdi mdi-web text-2xl 2xl:text-3xl text-gold"></i>
                </button>
                <div *ngIf="languageOpen" class="absolute inset-e-0 top-full mt-3 w-40 bg-white/95 backdrop-blur-sm border border-gold/30 rounded-sm shadow-[0_8px_30px_rgba(0,0,0,0.10)] overflow-hidden z-50 p-1">
                    <button type="button" (click)="changeLanguage('en')"
                        class="cursor-pointer group w-full flex items-center justify-between px-3 py-2.5 font-sans text-sm text-text rounded-sm transition-all duration-300 hover:bg-beige hover:text-gold">
                        <span class="flex items-center gap-3">
                            <img [src]="imagePath.en" alt="English" class="w-7 h-5 object-cover rounded-xs shrink-0">
                            <span>English</span>
                        </span>
                    </button>
                    <button type="button" (click)="changeLanguage('fr')"
                        class="cursor-pointer group w-full flex items-center justify-between px-3 py-2.5 font-sans text-sm text-text rounded-sm transition-all duration-300 hover:bg-beige hover:text-gold">
                        <span class="flex items-center gap-3">
                            <img [src]="imagePath.fr" alt="Français" class="w-7 h-5 object-cover rounded-xs shrink-0">
                            <span>Français</span>
                        </span>
                    </button>
                    <button type="button" (click)="changeLanguage('ar')"
                        class="cursor-pointer group w-full flex items-center justify-between px-3 py-2.5 font-sans text-sm text-text rounded-sm transition-all duration-300 hover:bg-beige hover:text-gold">
                        <span class="flex items-center gap-3">
                            <img [src]="imagePath.ar" alt="العربية" class="w-7 h-5 object-cover rounded-xs shrink-0">
                            <span>العربية</span>
                        </span>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <!--mobile & tablet-->
    <div class="flex lg:hidden w-full h-full items-center justify-between">
        <div class="shrink-0">
            <img [src]="imagePath.logo" alt="Aurelis logo" class="w-20 h-20 sm:w-24 sm:h-24 object-contain" />
        </div>
        <!--mobile actions-->
        <div class="flex items-center gap-4">
            <button type="button" class="bg-transparent cursor-pointer" aria-label="Shopping cart">
                <i class="mdi mdi-cart-outline text-2xl sm:text-3xl text-gold"></i>
            </button>
            <button (click)="mobileMenuOpen = !mobileMenuOpen" [attr.aria-label]="mobileMenuOpen ? 'Close menu' : 'Open menu'" type="button" class="bg-transparent cursor-pointer" aria-label="menu">
                <i class="text-2xl sm:text-3xl text-gold"
                [ngClass]="mobileMenuOpen ? 'mdi mdi-close' : 'mdi mdi-menu'"></i>
            </button>
        </div>
    </div>

    <!-- Mobile menu -->
    <div *ngIf="mobileMenuOpen"
        class="lg:hidden absolute inset-s-0 inset-e-0 top-32 sm:top-32 bg-white border-t border-gold/20 shadow-lg z-40">
        <div class="px-6 md:px-8 py-6">
            <!-- Search -->
            <div class="relative w-full mb-6">
                <input type="text" name="mobileSearch" id="mobileSearch"
                    class="w-full h-11 border-2 border-gold-light outline-none px-4 pe-10 font-sans text-sm text-text-muted"
                    [placeholder]="'common.searchPlaceholder' | translate" />
                <i class="mdi mdi-magnify absolute inset-e-3 top-2 text-2xl text-gold-light"></i>
            </div>
            <!-- Navigation -->
            <nav class="flex flex-col">
                <a *ngFor="let l of links" [routerLink]="l.link" routerLinkActive="text-gold"
                    [routerLinkActiveOptions]="{ exact: true }" (click)="mobileMenuOpen = false"
                    class="py-4 border-b border-beige font-poppins capitalize font-medium text-base text-text transition-colors duration-300 hover:text-gold">
                    {{ l.label | translate }}
                </a>
            </nav>
            <!-- Actions -->
            <div class="mt-6 flex flex-col">
                <!-- Wishlist -->
                <button type="button"
                    class="flex items-center gap-3 py-3 font-sans text-base text-text hover:text-gold transition-colors duration-300">
                    <i class="mdi mdi-heart-outline text-xl text-gold"></i>
                    <span>{{ 'navbar.wishlist' | translate }}</span>
                </button>
                <!-- Account -->
                <button type="button"
                    class="flex items-center gap-3 py-3 font-sans text-base text-text hover:text-gold transition-colors duration-300">
                    <i class="mdi mdi-account-outline text-xl text-gold"></i>
                    <span>{{ 'navbar.account' | translate }}</span>
                </button>
            </div>
            <!-- Language -->
            <div class="mt-4 pt-4 border-t border-beige">
                <p class="font-display text-lg text-gold mb-3">
                    {{ 'footer.language' | translate }}
                </p>
                <div class="flex items-center gap-3">
                    <button type="button" (click)="changeLanguage('en')"
                        class="flex items-center gap-2 px-3 py-2 border border-gold/20 hover:bg-beige transition-colors duration-300">
                        <img [src]="imagePath.en" alt="English" class="w-7 h-5 object-cover rounded-xs" />
                        <span class="font-sans text-sm">EN</span>
                    </button>
                    <button type="button" (click)="changeLanguage('fr')"
                        class="flex items-center gap-2 px-3 py-2 border border-gold/20 hover:bg-beige transition-colors duration-300">
                        <img [src]="imagePath.fr" alt="Français" class="w-7 h-5 object-cover rounded-xs" />
                        <span class="font-sans text-sm">FR</span>
                    </button>
                    <button type="button" (click)="changeLanguage('ar')"
                        class="flex items-center gap-2 px-3 py-2 border border-gold/20 hover:bg-beige transition-colors duration-300">
                        <img [src]="imagePath.ar" alt="العربية" class="w-7 h-5 object-cover rounded-xs" />
                        <span class="font-sans text-sm">AR</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</header>
